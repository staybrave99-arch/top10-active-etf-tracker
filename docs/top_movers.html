<title>全市場買賣最大股票：變動率與股價走勢</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #6b6a65;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --red:            #e34948;
    --red-soft:       #e3494814;
    --blue:           #2a78d6;
    --blue-soft:      #2a78d614;
    --green:          #008300;
    --green-soft:     #00830022;
    --violet:         #4a3aa7;
    --price-line:     #52514e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .viz-root { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }

  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; line-height: 1.5; }

  .legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .swatch.price { width: 16px; height: 2px; border-radius: 1px; background: var(--price-line); }
  .swatch.shares { width: 16px; height: 2px; border-radius: 1px; background: var(--blue); }
  .swatch.up { background: var(--red); }
  .swatch.down { background: var(--blue); }

  button.toggle {
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  button.toggle:hover { color: var(--text-primary); border-color: var(--axis); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 8px;
  }
  .panel-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
  .panel-title { font-size: 17px; font-weight: 600; margin: 0; }
  .tag {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--grid);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .tag.buy-streak { color: #ffffff; background: var(--green); }
  .tag.sell-streak { color: #ffffff; background: var(--red); }
  .tag.buy-today { color: var(--green); background: var(--green-soft); }
  .tag.sell-today { color: var(--red); background: var(--red-soft); }
  .tag.liquidated { color: #ffffff; background: var(--violet); }
  .panel-subtitle { font-size: 10px; fill: var(--text-muted); }

  .axis-label-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin: 2px 0; }
  .axis-label.shares-axis { color: var(--blue); }
  .axis-label.date-axis { text-align: center; font-size: 10px; color: var(--text-muted); margin: 2px 0 0; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .zero-line { stroke: var(--axis); stroke-width: 1; }
  .tick-label { font-size: 10px; fill: var(--text-muted); }
  .line-price { fill: none; stroke: var(--price-line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .line-shares { fill: none; stroke: var(--blue); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .shares-dot { fill: var(--blue); }
  .bar-up { fill: var(--red); }
  .bar-down { fill: var(--blue); }
  .end-dot { stroke: var(--surface-1); stroke-width: 2; }
  .hit { fill: transparent; cursor: pointer; touch-action: pan-y; }
  .crosshair { stroke: var(--axis); stroke-width: 1; opacity: 0; pointer-events: none; }
  .crosshair.show { opacity: 1; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 10;
    min-width: 150px;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-title { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
  .tooltip .t-val { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
  table.data-table th, table.data-table td {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th:first-child, table.data-table td:first-child,
  table.data-table th:nth-child(2), table.data-table td:nth-child(2) {
    text-align: left;
    font-variant-numeric: normal;
  }
  table.data-table th { color: var(--text-muted); font-weight: 500; font-size: 11px; }
  .hidden { display: none; }
</style>

      tooltip.appendChild(row);
    });
    tooltip.classList.add('show');
    moveTooltip(evt);
  }
  function moveTooltip(evt) {
    const pad = 14;
    let left = evt.clientX + pad, top = evt.clientY + pad;
    if (left + 190 > window.innerWidth) left = evt.clientX - 190 - pad;
    if (top + 110 > window.innerHeight) top = evt.clientY - 110 - pad;
    tooltip.style.left = left + 'px'; tooltip.style.top = top + 'px';
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  // Tapping anywhere outside a bar/point dismisses a tap-opened tooltip;
  // the per-hit click handlers stop propagation so tapping a bar doesn't
  // immediately re-trigger this and hide the one it just opened. render()
  // only runs once in this template, so this listener is added exactly
  // once, not re-stacked.
  document.addEventListener('click', hideTooltip);

  // The tooltip is position:fixed, so it stays put on screen -- not tied
  // to any panel -- while the page scrolls underneath it. Scrolling is a
  // pan gesture, not a click, so it never hit the listener above: without
  // this, a tooltip pinned on one stock's chart would keep showing that
  // stock's numbers after scrolling a *different* stock's chart into the
  // same screen position, making it look like the new panel had wrong
  // data. Every panel's own hideCrosshair() gets pushed into this array
  // below so one scroll listener can clear all of them at once.
  const allHideCrosshairs = [];
  window.addEventListener('scroll', () => {
    hideTooltip();
    allHideCrosshairs.forEach(fn => fn());
  }, { passive: true, capture: true });

  const chartWrap = document.getElementById('chartWrap');
  chartWrap.innerHTML = '';

  DATA.stocks.forEach(stock => {
    const dates = stock.dates;
    const W = 460;
    const PH = 90, PM = { top: 8, right: 36, bottom: 4, left: 40 };
    const VH = 90, VM = { top: 8, right: 36, bottom: 18, left: 40 };
    const pPlotW = W - PM.left - PM.right;
    const vPlotW = W - VM.left - VM.right;
    const pPlotH = PH - PM.top - PM.bottom;
    const vPlotH = VH - VM.top - VM.bottom;

    const xAt = (i, plotW, left) => left + (dates.length <= 1 ? plotW / 2 : (i / (dates.length - 1)) * plotW);

    // --- price sub-chart ---
    const priceSvg = el('svg', { viewBox: `0 0 ${W} ${PH}`, role: 'img', 'aria-label': `${stock.stock_code} ${stock.stock_name} 股價走勢` });
    const closes = stock.close.filter(v => v !== null);
    if (closes.length > 1) {
      const cMin = Math.min(...closes), cMax = Math.max(...closes);
      const cPad = (cMax - cMin) * 0.15 || Math.max(cMax * 0.02, 1);
      const priceYScale = v => PM.top + (cMax + cPad - v) / (cMax - cMin + 2 * cPad) * pPlotH;

      [cMin, cMax].forEach(v => {
        priceSvg.appendChild(el('line', { class: 'grid-line', x1: PM.left, y1: priceYScale(v), x2: W - PM.right, y2: priceYScale(v) }));
        const t = el('text', { class: 'tick-label', x: PM.left - 6, y: priceYScale(v) + 3, 'text-anchor': 'end' });
        t.textContent = v.toFixed(1);
        priceSvg.appendChild(t);
      });

      const pricePts = stock.close.map((v, i) => ({ i, v })).filter(p => p.v !== null);
      const pd = pricePts.map((p, k) => `${k === 0 ? 'M' : 'L'} ${xAt(p.i, pPlotW, PM.left)} ${priceYScale(p.v)}`).join(' ');
      priceSvg.appendChild(el('path', { class: 'line-price', d: pd }));
      const lastP = pricePts[pricePts.length - 1];
      priceSvg.appendChild(el('circle', { class: 'end-dot', cx: xAt(lastP.i, pPlotW, PM.left), cy: priceYScale(lastP.v), r: 3.5, fill: 'var(--price-line)' }));
    }

    // --- second line on the same sub-chart: total combined shares held
    // across the 8 tracked ETFs, on its own right-hand Y axis (a share
    // count and a price are different units -- only the X axis is shared).
    // Stored shares are raw 股; displayed as 張 (1 張 = 1,000 股, the
    // standard board-lot size) to match how holdings are normally quoted.
    const sharesPts = (stock.shares || [])
      .map((v, i) => ({ i, v: v === null || v === undefined ? null : v / 1000 }))
      .filter(p => p.v !== null);
    if (sharesPts.length > 1) {
      const sVals = sharesPts.map(p => p.v);
      const sMin = Math.min(...sVals), sMax = Math.max(...sVals);
      const sPad = (sMax - sMin) * 0.15 || Math.max(sMax * 0.02, 1);
      const sharesYScale = v => PM.top + (sMax + sPad - v) / (sMax - sMin + 2 * sPad) * pPlotH;

      [sMin, sMax].forEach(v => {
        const t = el('text', { class: 'tick-label', x: W - PM.right + 6, y: sharesYScale(v) + 3, 'text-anchor': 'start', fill: 'var(--blue)' });
        t.textContent = Math.round(v).toLocaleString();
        priceSvg.appendChild(t);
      });

      const sd = sharesPts.map((p, k) => `${k === 0 ? 'M' : 'L'} ${xAt(p.i, pPlotW, PM.left)} ${sharesYScale(p.v)}`).join(' ');
      priceSvg.appendChild(el('path', { class: 'line-shares', d: sd }));
      sharesPts.forEach(p => {
        priceSvg.appendChild(el('circle', { class: 'shares-dot', cx: xAt(p.i, pPlotW, PM.left), cy: sharesYScale(p.v), r: 2.2 }));
      });
    }

    // --- variation-rate sub-chart (diverging bars around zero, signed-log
    // y-axis -- daily variation rates commonly span from a fraction of a
    // percent to several thousand percent in one bar's neighbors (a tiny
    // prior share base inflates the %% change), so a linear axis would
    // crush every ordinary day into invisibility next to one spike. ---
    const varSvg = el('svg', { viewBox: `0 0 ${W} ${VH}`, role: 'img', 'aria-label': `${stock.stock_code} ${stock.stock_name} 跨ETF變動率` });
    const vAbs = stock.variation_rate.filter(v => v !== null).map(Math.abs);
    const vMax = Math.max(...vAbs, 0.01) * 1.15;
    const vLogT = v => Math.sign(v) * Math.log10(Math.abs(v) + 1);
    const vMaxLog = vLogT(vMax);
    // Sign fixed to match the price/quadrant charts' convention (larger
    // positive -> smaller pixel y -> renders higher): using (vLogT(v) +
    // vMaxLog) here was backwards and put positive bars *below* the zero
    // line instead of above it, so they never actually touched zeroY.
    const varYScale = v => VM.top + (vMaxLog - vLogT(v)) / (2 * vMaxLog) * vPlotH;
    const zeroY = varYScale(0);

    varSvg.appendChild(el('line', { class: 'zero-line', x1: VM.left, y1: zeroY, x2: W - VM.right, y2: zeroY }));
    [-0.5, 0.5].forEach(f => {
      const gy = varYScale(Math.sign(f) * (Math.pow(10, Math.abs(f * vMaxLog)) - 1));
      varSvg.appendChild(el('line', { class: 'grid-line', x1: VM.left, y1: gy, x2: W - VM.right, y2: gy }));
    });
    [vMax, -vMax].forEach(v => {
      const t = el('text', { class: 'tick-label', x: VM.left - 6, y: varYScale(v) + 3, 'text-anchor': 'end' });
      t.textContent = (v * 100).toFixed(1) + '%';
      varSvg.appendChild(t);
    });
    [0, dates.length - 1].forEach(i => {
      const t = el('text', { class: 'tick-label', x: xAt(i, vPlotW, VM.left), y: VH - 4, 'text-anchor': i === 0 ? 'start' : 'end' });
      t.textContent = dates[i];
      varSvg.appendChild(t);
    });

    const barW = Math.max(vPlotW / Math.max(dates.length, 1) * 0.6, 2);
    dates.forEach((date, i) => {
      const v = stock.variation_rate[i];
      if (v === null || v === 0) return;
      const x = xAt(i, vPlotW, VM.left);
      const y = v > 0 ? varYScale(v) : zeroY;
      const h = Math.abs(varYScale(v) - zeroY);
      varSvg.appendChild(el('rect', { class: v > 0 ? 'bar-up' : 'bar-down', x: x - barW / 2, y, width: barW, height: h }));
    });
    // --- shared crosshair, spanning both sub-charts ---
    // A single continuous scrub interaction (not per-date discrete hit
    // targets) drives one crosshair line in each SVG. pointermove alone
    // covers both input types: for a mouse it fires on hover (no button
    // needed), for touch it only fires while a finger is down -- which is
    // exactly "drag to scrub". pointerdown additionally fires it once
    // immediately, so a plain tap-without-moving still shows a value.
    const priceCrosshair = el('line', { class: 'crosshair', x1: 0, x2: 0, y1: 0, y2: PH });
    const varCrosshair = el('line', { class: 'crosshair', x1: 0, x2: 0, y1: 0, y2: VH });
    priceSvg.appendChild(priceCrosshair);
    varSvg.appendChild(varCrosshair);

    function updateCrosshair(idx, evt) {
      idx = Math.max(0, Math.min(dates.length - 1, idx));
      const date = dates[idx];
      const xP = xAt(idx, pPlotW, PM.left);
      const xV = xAt(idx, vPlotW, VM.left);
      priceCrosshair.setAttribute('x1', xP); priceCrosshair.setAttribute('x2', xP);
      varCrosshair.setAttribute('x1', xV); varCrosshair.setAttribute('x2', xV);
      priceCrosshair.classList.add('show');
      varCrosshair.classList.add('show');
      const v = stock.variation_rate[idx];
      const shares = (stock.shares || [])[idx];
      const rows = [
        ['收盤價', stock.close[idx], 2],
        ['合計持股張數', shares === null || shares === undefined ? null : Math.round(shares / 1000).toLocaleString()],
        ['變動率', v === null ? null : v * 100, 2, '%'],
      ];
      showTooltip(evt, date, rows);
    }
    function hideCrosshair() {
      priceCrosshair.classList.remove('show');
      varCrosshair.classList.remove('show');
      hideTooltip();
    }
    allHideCrosshairs.push(hideCrosshair);
    // Pointer capture (set on down) keeps subsequent pointermove events
    // routed to the SAME overlay even if the finger drifts vertically into
    // the other sub-chart -- only clientX is used, so that's harmless and
    // lets one continuous drag scrub across both stacked charts.
    function attachScrub(overlay, svgEl, plotW, left) {
      function indexFromEvent(evt) {
        const rect = svgEl.getBoundingClientRect();
        const scaleX = rect.width / W;
        const localX = (evt.clientX - rect.left) / scaleX;
        const frac = dates.length <= 1 ? 0 : Math.max(0, Math.min(1, (localX - left) / plotW));
        return Math.round(frac * (dates.length - 1));
      }
      overlay.addEventListener('pointerdown', evt => {
        evt.stopPropagation();
        overlay.setPointerCapture(evt.pointerId);
        updateCrosshair(indexFromEvent(evt), evt);
      });
      overlay.addEventListener('pointermove', evt => updateCrosshair(indexFromEvent(evt), evt));
      overlay.addEventListener('pointerleave', evt => {
        // Touch has no true hover state -- lifting a finger fires
        // pointerleave right after pointerup, so only a mouse actually
        // leaving the chart should dismiss; a touch crosshair stays
        // pinned until the user taps elsewhere (document click handler).
        if (evt.pointerType === 'mouse') hideCrosshair();
      });
      overlay.addEventListener('click', evt => evt.stopPropagation());
    }

    const priceOverlay = el('rect', { class: 'hit', x: PM.left, y: 0, width: pPlotW, height: PH });
    priceSvg.appendChild(priceOverlay);
    attachScrub(priceOverlay, priceSvg, pPlotW, PM.left);

    const varOverlay = el('rect', { class: 'hit', x: VM.left, y: VM.top, width: vPlotW, height: vPlotH });
    varSvg.appendChild(varOverlay);
    attachScrub(varOverlay, varSvg, vPlotW, VM.left);

    const panel = document.createElement('div');
    panel.className = 'panel';
    const titleRow = document.createElement('div');
    titleRow.className = 'panel-title-row';
    const title = document.createElement('p');
    title.className = 'panel-title';
    title.textContent = `${stock.stock_code} ${stock.stock_name}`;
    titleRow.appendChild(title);
    const tagClass = tag => {
      if (tag === '出清') return 'tag liquidated';
      if (tag.startsWith('連續買超')) return 'tag buy-streak';
      if (tag.startsWith('連續賣超')) return 'tag sell-streak';
      if (tag.startsWith('買超')) return 'tag buy-today';
      if (tag.startsWith('賣超')) return 'tag sell-today';
      return 'tag';
    };
    (stock.tags || []).forEach(tag => {
      const badge = document.createElement('span');
      badge.className = tagClass(tag);
      badge.textContent = tag;
      titleRow.appendChild(badge);
    });
    const axisLabelRow = (leftText, rightText) => {
      const row = document.createElement('div');
      row.className = 'axis-label-row';
      const l = document.createElement('span'); l.className = 'axis-label price-axis'; l.textContent = leftText;
      row.appendChild(l);
      if (rightText) {
        const r = document.createElement('span'); r.className = 'axis-label shares-axis'; r.textContent = rightText;
        row.appendChild(r);
      }
      return row;
    };

    panel.appendChild(titleRow);
    panel.appendChild(axisLabelRow('股價（元・左軸）', '合計持股張數（張・右軸）'));
    panel.appendChild(priceSvg);
    panel.appendChild(axisLabelRow('變動率（%・對數座標）'));
    panel.appendChild(varSvg);
    const dateAxisLabel = document.createElement('div');
    dateAxisLabel.className = 'axis-label date-axis';
    dateAxisLabel.textContent = '日期';
    panel.appendChild(dateAxisLabel);
    chartWrap.appendChild(panel);
  });

  const tableWrap = document.getElementById('tableWrap');
  const table = document.createElement('table');
  table.className = 'data-table';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['股票', '日期', '收盤價', '變動率(%)'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  DATA.stocks.forEach(stock => {
    stock.dates.forEach((date, i) => {
      const tr = document.createElement('tr');
      const v = stock.variation_rate[i];
      [
        `${stock.stock_code} ${stock.stock_name}`, date,
        stock.close[i] === null ? '—' : stock.close[i].toFixed(2),
        v === null ? '—' : (v * 100).toFixed(2),
      ].forEach(c => {
        const td = document.createElement('td'); td.textContent = c; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  tableWrap.innerHTML = '';
  tableWrap.appendChild(table);
}

document.getElementById('tableToggle').addEventListener('click', () => {
  const chart = document.getElementById('chartWrap');
  const table = document.getElementById('tableWrap');
  const showingTable = !table.classList.contains('hidden');
  chart.classList.toggle('hidden', !showingTable);
  table.classList.toggle('hidden', showingTable);
  document.getElementById('tableToggle').textContent = showingTable ? '切換表格檢視' : '切換圖表檢視';
});

render();
</script>

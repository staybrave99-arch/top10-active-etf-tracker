<style>
  .viz-root {
    color-scheme: light;

    --border:         rgba(11,11,11,0.10);
    --red:            #e34948;
    --red-soft:       #e3494814;
    --blue:           #2a78d6;
    --blue-soft:      #2a78d614;
    --green:          #008300;
    --green-soft:     #00830022;
    --violet:         #4a3aa7;
    --price-line:     #52514e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .viz-root { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }

  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; line-height: 1.5; }

  .legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .swatch.price { width: 16px; height: 2px; border-radius: 1px; background: var(--price-line); }
  .swatch.shares { width: 16px; height: 2px; border-radius: 1px; background: var(--blue); }
  .swatch.up { background: var(--red); }
  .swatch.down { background: var(--blue); }

  button.toggle {
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  button.toggle:hover { color: var(--text-primary); border-color: var(--axis); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 8px;
  }
  .panel-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
  .panel-title { font-size: 17px; font-weight: 600; margin: 0; }
  .tag {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--grid);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .tag.buy-streak { color: #ffffff; background: var(--green); }
  .tag.sell-streak { color: #ffffff; background: var(--red); }
  .tag.buy-today { color: var(--green); background: var(--green-soft); }
  .tag.sell-today { color: var(--red); background: var(--red-soft); }
  .tag.liquidated { color: #ffffff; background: var(--violet); }
  .panel-subtitle { font-size: 10px; fill: var(--text-muted); }

  .axis-label-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin: 2px 0; }
  .axis-label.shares-axis { color: var(--blue); }
  .axis-label.date-axis { text-align: center; font-size: 10px; color: var(--text-muted); margin: 2px 0 0; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .zero-line { stroke: var(--axis); stroke-width: 1; }
  .tick-label { font-size: 10px; fill: var(--text-muted); }
  .line-price { fill: none; stroke: var(--price-line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .line-shares { fill: none; stroke: var(--blue); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .shares-dot { fill: var(--blue); }
  .bar-up { fill: var(--red); }
  .bar-down { fill: var(--blue); }
  .end-dot { stroke: var(--surface-1); stroke-width: 2; }
  .hit { fill: transparent; cursor: pointer; touch-action: pan-y; }
  .crosshair { stroke: var(--axis); stroke-width: 1; opacity: 0; pointer-events: none; }
  .crosshair.show { opacity: 1; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 10;
    min-width: 150px;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-title { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
  .tooltip .t-val { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
  table.data-table th, table.data-table td {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th:first-child, table.data-table td:first-child,
  table.data-table th:nth-child(2), table.data-table td:nth-child(2) {
    text-align: left;
    font-variant-numeric: normal;
  }
  table.data-table th { color: var(--text-muted); font-weight: 500; font-size: 11px; }
  .hidden { display: none; }
</style>

    // the other sub-chart -- only clientX is used, so that's harmless and
    // lets one continuous drag scrub across both stacked charts.
    function attachScrub(overlay, svgEl, plotW, left) {
      function indexFromEvent(evt) {
        const rect = svgEl.getBoundingClientRect();
        const scaleX = rect.width / W;
        const localX = (evt.clientX - rect.left) / scaleX;
        const frac = dates.length <= 1 ? 0 : Math.max(0, Math.min(1, (localX - left) / plotW));
        return Math.round(frac * (dates.length - 1));
      }
      overlay.addEventListener('pointerdown', evt => {
        evt.stopPropagation();
        overlay.setPointerCapture(evt.pointerId);
        updateCrosshair(indexFromEvent(evt), evt);
      });
      overlay.addEventListener('pointermove', evt => updateCrosshair(indexFromEvent(evt), evt));
      overlay.addEventListener('pointerleave', evt => {
        // Touch has no true hover state -- lifting a finger fires
        // pointerleave right after pointerup, so only a mouse actually
        // leaving the chart should dismiss; a touch crosshair stays
        // pinned until the user taps elsewhere (document click handler).
        if (evt.pointerType === 'mouse') hideCrosshair();
      });
      overlay.addEventListener('click', evt => evt.stopPropagation());
    }

    const priceOverlay = el('rect', { class: 'hit', x: PM.left, y: 0, width: pPlotW, height: PH });
    priceSvg.appendChild(priceOverlay);
    attachScrub(priceOverlay, priceSvg, pPlotW, PM.left);

    const varOverlay = el('rect', { class: 'hit', x: VM.left, y: VM.top, width: vPlotW, height: vPlotH });
    varSvg.appendChild(varOverlay);
    attachScrub(varOverlay, varSvg, vPlotW, VM.left);

    const panel = document.createElement('div');
    panel.className = 'panel';
    const titleRow = document.createElement('div');
    titleRow.className = 'panel-title-row';
    const title = document.createElement('p');
    title.className = 'panel-title';
    title.textContent = `${stock.stock_code} ${stock.stock_name}`;
    titleRow.appendChild(title);
    const tagClass = tag => {
      if (tag === '出清') return 'tag liquidated';
      if (tag.startsWith('連續買超')) return 'tag buy-streak';
      if (tag.startsWith('連續賣超')) return 'tag sell-streak';
      if (tag.startsWith('買超')) return 'tag buy-today';
      if (tag.startsWith('賣超')) return 'tag sell-today';
      return 'tag';
    };
    (stock.tags || []).forEach(tag => {
      const badge = document.createElement('span');
      badge.className = tagClass(tag);
      badge.textContent = tag;
      titleRow.appendChild(badge);
    });
    const axisLabelRow = (leftText, rightText) => {
      const row = document.createElement('div');
      row.className = 'axis-label-row';
      const l = document.createElement('span'); l.className = 'axis-label price-axis'; l.textContent = leftText;
      row.appendChild(l);
      if (rightText) {
        const r = document.createElement('span'); r.className = 'axis-label shares-axis'; r.textContent = rightText;
        row.appendChild(r);
      }
      return row;
    };

    panel.appendChild(titleRow);
    panel.appendChild(axisLabelRow('股價（元・左軸）', '合計持股張數（張・右軸）'));
    panel.appendChild(priceSvg);
    panel.appendChild(axisLabelRow('變動率（%・對數座標）'));
    panel.appendChild(varSvg);
    const dateAxisLabel = document.createElement('div');
    dateAxisLabel.className = 'axis-label date-axis';
    dateAxisLabel.textContent = '日期';
    panel.appendChild(dateAxisLabel);
    chartWrap.appendChild(panel);
  });

  const tableWrap = document.getElementById('tableWrap');
  const table = document.createElement('table');
  table.className = 'data-table';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['股票', '日期', '收盤價', '變動率(%)'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  DATA.stocks.forEach(stock => {
    stock.dates.forEach((date, i) => {
      const tr = document.createElement('tr');
      const v = stock.variation_rate[i];
      [
        `${stock.stock_code} ${stock.stock_name}`, date,
        stock.close[i] === null ? '—' : stock.close[i].toFixed(2),
        v === null ? '—' : (v * 100).toFixed(2),
      ].forEach(c => {
        const td = document.createElement('td'); td.textContent = c; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  tableWrap.innerHTML = '';
  tableWrap.appendChild(table);
}

document.getElementById('tableToggle').addEventListener('click', () => {
  const chart = document.getElementById('chartWrap');
  const table = document.getElementById('tableWrap');
  const showingTable = !table.classList.contains('hidden');
  chart.classList.toggle('hidden', !showingTable);
  table.classList.toggle('hidden', showingTable);
  document.getElementById('tableToggle').textContent = showingTable ? '切換表格檢視' : '切換圖表檢視';
});

render();
</script>

const svgNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function render() {
  const totalDays = DATA.stocks[0] ? DATA.stocks[0].dates.length : 0;
  document.getElementById('subtitle').textContent =
    `共 ${totalDays} 個交易日 ・ 變動率 = 當天跨ETF合計持股股數變化 / 前一日合計股數 ・ 上圖股價、下圖變動率（Y軸為對數座標），各自獨立Y軸，共用日期軸`;

  const tooltip = document.getElementById('tooltip');
  function showTooltip(evt, date, rows) {
    tooltip.innerHTML = '';
    const title = document.createElement('div');
    title.className = 't-title';
    title.textContent = date;
    tooltip.appendChild(title);
    rows.forEach(([k, v, digits, suffix]) => {
      const row = document.createElement('div');
      row.className = 't-row';
      const kEl = document.createElement('span'); kEl.textContent = k;
      const vEl = document.createElement('span'); vEl.className = 't-val';
      vEl.textContent = v === null || v === undefined ? '—' : (typeof v === 'number' ? v.toFixed(digits ?? 2) + (suffix || '') : v);
      row.appendChild(kEl); row.appendChild(vEl);
      tooltip.appendChild(row);
    });
    tooltip.classList.add('show');
    moveTooltip(evt);
  }
  function moveTooltip(evt) {
    const pad = 14;
    let left = evt.clientX + pad, top = evt.clientY + pad;
    if (left + 190 > window.innerWidth) left = evt.clientX - 190 - pad;
    if (top + 110 > window.innerHeight) top = evt.clientY - 110 - pad;
    tooltip.style.left = left + 'px'; tooltip.style.top = top + 'px';
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  // Tapping anywhere outside a bar/point dismisses a tap-opened tooltip;
  // the per-hit click handlers stop propagation so tapping a bar doesn't
  // immediately re-trigger this and hide the one it just opened. render()
  // only runs once in this template, so this listener is added exactly
  // once, not re-stacked.
  document.addEventListener('click', hideTooltip);

  const chartWrap = document.getElementById('chartWrap');
  chartWrap.innerHTML = '';

  DATA.stocks.forEach(stock => {
    const dates = stock.dates;
    const W = 460;
    const PH = 90, PM = { top: 8, right: 10, bottom: 4, left: 40 };
    const VH = 90, VM = { top: 8, right: 10, bottom: 18, left: 40 };
    const pPlotW = W - PM.left - PM.right;
    const vPlotW = W - VM.left - VM.right;
    const pPlotH = PH - PM.top - PM.bottom;
    const vPlotH = VH - VM.top - VM.bottom;

    const xAt = (i, plotW, left) => left + (dates.length <= 1 ? plotW / 2 : (i / (dates.length - 1)) * plotW);

    // --- price sub-chart ---
    const priceSvg = el('svg', { viewBox: `0 0 ${W} ${PH}`, role: 'img', 'aria-label': `${stock.stock_code} ${stock.stock_name} 股價走勢` });
    const closes = stock.close.filter(v => v !== null);
    if (closes.length > 1) {
      const cMin = Math.min(...closes), cMax = Math.max(...closes);
      const cPad = (cMax - cMin) * 0.15 || Math.max(cMax * 0.02, 1);
      const priceYScale = v => PM.top + (cMax + cPad - v) / (cMax - cMin + 2 * cPad) * pPlotH;

      [cMin, cMax].forEach(v => {
        priceSvg.appendChild(el('line', { class: 'grid-line', x1: PM.left, y1: priceYScale(v), x2: W - PM.right, y2: priceYScale(v) }));
        const t = el('text', { class: 'tick-label', x: PM.left - 6, y: priceYScale(v) + 3, 'text-anchor': 'end' });
        t.textContent = v.toFixed(1);
        priceSvg.appendChild(t);
      });

      const pricePts = stock.close.map((v, i) => ({ i, v })).filter(p => p.v !== null);
      const pd = pricePts.map((p, k) => `${k === 0 ? 'M' : 'L'} ${xAt(p.i, pPlotW, PM.left)} ${priceYScale(p.v)}`).join(' ');
      priceSvg.appendChild(el('path', { class: 'line-price', d: pd }));
      const lastP = pricePts[pricePts.length - 1];
      priceSvg.appendChild(el('circle', { class: 'end-dot', cx: xAt(lastP.i, pPlotW, PM.left), cy: priceYScale(lastP.v), r: 3.5, fill: 'var(--price-line)' }));

      dates.forEach((date, i) => {
        if (stock.close[i] === null) return;
        const hitW = pPlotW / Math.max(dates.length - 1, 1);
        const hit = el('rect', { class: 'hit', x: xAt(i, pPlotW, PM.left) - hitW / 2, y: 0, width: hitW, height: PH });
        const rows = [['收盤價', stock.close[i], 2]];
        hit.addEventListener('pointerenter', evt => showTooltip(evt, date, rows));
        hit.addEventListener('pointermove', moveTooltip);
        hit.addEventListener('pointerleave', hideTooltip);
        hit.addEventListener('click', evt => { evt.stopPropagation(); showTooltip(evt, date, rows); });
        priceSvg.appendChild(hit);
      });
    }

    // --- variation-rate sub-chart (diverging bars around zero, signed-log
    // y-axis -- daily variation rates commonly span from a fraction of a
    // percent to several thousand percent in one bar's neighbors (a tiny
    // prior share base inflates the %% change), so a linear axis would
    // crush every ordinary day into invisibility next to one spike. ---
    const varSvg = el('svg', { viewBox: `0 0 ${W} ${VH}`, role: 'img', 'aria-label': `${stock.stock_code} ${stock.stock_name} 跨ETF變動率` });
    const vAbs = stock.variation_rate.filter(v => v !== null).map(Math.abs);
    const vMax = Math.max(...vAbs, 0.01) * 1.15;
    const vLogT = v => Math.sign(v) * Math.log10(Math.abs(v) + 1);
    const vMaxLog = vLogT(vMax);
    // Sign fixed to match the price/quadrant charts' convention (larger
    // positive -> smaller pixel y -> renders higher): using (vLogT(v) +
    // vMaxLog) here was backwards and put positive bars *below* the zero
    // line instead of above it, so they never actually touched zeroY.
    const varYScale = v => VM.top + (vMaxLog - vLogT(v)) / (2 * vMaxLog) * vPlotH;
    const zeroY = varYScale(0);

    varSvg.appendChild(el('line', { class: 'zero-line', x1: VM.left, y1: zeroY, x2: W - VM.right, y2: zeroY }));
    [-0.5, 0.5].forEach(f => {
      const gy = varYScale(Math.sign(f) * (Math.pow(10, Math.abs(f * vMaxLog)) - 1));
      varSvg.appendChild(el('line', { class: 'grid-line', x1: VM.left, y1: gy, x2: W - VM.right, y2: gy }));
    });
    [vMax, -vMax].forEach(v => {
      const t = el('text', { class: 'tick-label', x: VM.left - 6, y: varYScale(v) + 3, 'text-anchor': 'end' });
      t.textContent = (v * 100).toFixed(1) + '%';
      varSvg.appendChild(t);
    });
    [0, dates.length - 1].forEach(i => {
      const t = el('text', { class: 'tick-label', x: xAt(i, vPlotW, VM.left), y: VH - 4, 'text-anchor': i === 0 ? 'start' : 'end' });
      t.textContent = dates[i];
      varSvg.appendChild(t);
    });

    const barW = Math.max(vPlotW / Math.max(dates.length, 1) * 0.6, 2);
    dates.forEach((date, i) => {
      const v = stock.variation_rate[i];
      if (v === null || v === 0) return;
      const x = xAt(i, vPlotW, VM.left);
      const y = v > 0 ? varYScale(v) : zeroY;
      const h = Math.abs(varYScale(v) - zeroY);
      varSvg.appendChild(el('rect', { class: v > 0 ? 'bar-up' : 'bar-down', x: x - barW / 2, y, width: barW, height: h }));
    });
    dates.forEach((date, i) => {
      const hitW = vPlotW / Math.max(dates.length - 1, 1);
      const hit = el('rect', { class: 'hit', x: xAt(i, vPlotW, VM.left) - hitW / 2, y: VM.top, width: hitW, height: vPlotH });
      const rows = [['變動率', stock.variation_rate[i] === null ? null : stock.variation_rate[i] * 100, 2, '%']];
      hit.addEventListener('pointerenter', evt => showTooltip(evt, date, rows));
      hit.addEventListener('pointermove', moveTooltip);
      hit.addEventListener('pointerleave', hideTooltip);
      hit.addEventListener('click', evt => { evt.stopPropagation(); showTooltip(evt, date, rows); });
      varSvg.appendChild(hit);
    });

    const panel = document.createElement('div');
    panel.className = 'panel';
    const titleRow = document.createElement('div');
    titleRow.className = 'panel-title-row';
    const title = document.createElement('p');
    title.className = 'panel-title';
    title.textContent = `${stock.stock_code} ${stock.stock_name}`;
    titleRow.appendChild(title);
    const tagClass = tag => {
      if (tag === '出清') return 'tag liquidated';
      if (tag.startsWith('連續買超')) return 'tag buy-streak';
      if (tag.startsWith('連續賣超')) return 'tag sell-streak';
      if (tag.startsWith('買超')) return 'tag buy-today';
      if (tag.startsWith('賣超')) return 'tag sell-today';
      return 'tag';
    };
    (stock.tags || []).forEach(tag => {
      const badge = document.createElement('span');
      badge.className = tagClass(tag);
      badge.textContent = tag;
      titleRow.appendChild(badge);
    });
    panel.appendChild(titleRow);
    panel.appendChild(priceSvg);
    panel.appendChild(varSvg);
    chartWrap.appendChild(panel);
  });

  const tableWrap = document.getElementById('tableWrap');
  const table = document.createElement('table');
  table.className = 'data-table';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['股票', '日期', '收盤價', '變動率(%)'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  DATA.stocks.forEach(stock => {
    stock.dates.forEach((date, i) => {
      const tr = document.createElement('tr');
      const v = stock.variation_rate[i];
      [
        `${stock.stock_code} ${stock.stock_name}`, date,
        stock.close[i] === null ? '—' : stock.close[i].toFixed(2),
        v === null ? '—' : (v * 100).toFixed(2),
      ].forEach(c => {
        const td = document.createElement('td'); td.textContent = c; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  tableWrap.innerHTML = '';
  tableWrap.appendChild(table);
}

document.getElementById('tableToggle').addEventListener('click', () => {
  const chart = document.getElementById('chartWrap');
  const table = document.getElementById('tableWrap');
  const showingTable = !table.classList.contains('hidden');
  chart.classList.toggle('hidden', !showingTable);
  table.classList.toggle('hidden', showingTable);
  document.getElementById('tableToggle').textContent = showingTable ? '切換表格檢視' : '切換圖表檢視';
});

render();
</script>

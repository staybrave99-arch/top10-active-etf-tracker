<title>跨ETF個股籌碼象限圖</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --red:            #e34948;
    --red-soft:       #e3494814;
    --red-trail:      #e3494866;
    --blue:           #2a78d6;
    --blue-soft:      #2a78d614;
    --blue-trail:     #2a78d666;
    --warn-bg:        #fab21922;
    --warn-text:      #7a5200;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255,255,255,0.10);
      --red:            #e66767;
      --red-soft:       #e6676722;
      --red-trail:      #e6676788;
      --blue:           #3987e5;
      --blue-soft:      #3987e522;
      --blue-trail:     #3987e588;
      --warn-bg:        #fab21933;
      --warn-text:      #ffcf6b;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --red:            #e66767;
    --red-soft:       #e6676722;
    --red-trail:      #e6676788;
    --blue:           #3987e5;
    --blue-soft:      #3987e522;
    --blue-trail:     #3987e588;
    --warn-bg:        #fab21933;
    --warn-text:      #ffcf6b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .viz-root { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }

  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; }

  .banner {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .swatch.red { background: var(--red); }
  .swatch.blue { background: var(--blue); }

  button.toggle {
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button.toggle:hover { color: var(--text-primary); border-color: var(--axis); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis-label { font-size: 12px; fill: var(--text-muted); }
  .quad-label { font-size: 12px; font-weight: 600; fill: var(--text-secondary); }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .zero-line { stroke: var(--axis); stroke-width: 1; }
  .tick-label { font-size: 11px; fill: var(--text-muted); }
  .point-label { font-size: 11px; fill: var(--text-primary); pointer-events: none; }
  .trail-path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dot { stroke: var(--surface-1); stroke-width: 2; cursor: pointer; }
  .hit { fill: transparent; cursor: pointer; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 10;
    min-width: 160px;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
  .tooltip .t-val { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.data-table th, table.data-table td {
    text-align: right;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th:first-child, table.data-table td:first-child,
  table.data-table th:nth-child(2), table.data-table td:nth-child(2),
  table.data-table th:nth-child(3), table.data-table td:nth-child(3) {
    text-align: left;
    font-variant-numeric: normal;
  }
  table.data-table th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
  table.data-table td.pos { color: var(--red); }
  table.data-table td.neg { color: var(--blue); }
  .hidden { display: none; }
</style>

<div class="viz-root">
  <h1>跨ETF個股籌碼象限圖</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="banner">
    ⚠️ <strong>本圖表已改用真實資料</strong>，但持股明細目前只累積約 5 天歷史（未回填、逐日累積中）——
    NetScore 需要連續多天的加碼/減碼才會有意義的分數，現階段大部分股票的 streak 都還很短，
    符合「至少 2 家 ETF 共同買賣」門檻的股票可能很少甚至掛零，<strong>目前訊號還很淺，尚不足以當真實投資參考</strong>。
    股價的 BIAS 乖離率部分已有 27 個交易日歷史，計算基礎足夠。隨著每日排程持續累積持股資料，訊號會逐漸變得扎實。
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="legend">
        <span class="legend-item"><span class="swatch red"></span>淨加碼（NetScore ≥ 0）</span>
        <span class="legend-item"><span class="swatch blue"></span>淨減碼（NetScore &lt; 0）</span>
        <span class="legend-item">氣泡大小 = 廣度（買超+賣超ETF家數）</span>
        <span class="legend-item">淡色軌跡 = 最近5個交易日走勢</span>
      </div>
      <button class="toggle" id="tableToggle">切換表格檢視</button>
    </div>
    <div id="chartWrap"></div>
    <div id="tableWrap" class="hidden"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const DATA = {"trade_date": "2026-07-24", "points": [{"stock_code": "3653", "stock_name": "健策", "net_score": -36.74, "bias": 2.57, "quadrant": "強勢減碼", "n_buy": 1, "n_sell": 1, "breadth": 2, "max_buy_streak": 1, "max_sell_streak": 1, "close": 3430.0, "trail": [{"date": "2026-07-20", "net_score": 0.0, "bias": -5.09}, {"date": "2026-07-21", "net_score": 377.83, "bias": 4.9}, {"date": "2026-07-22", "net_score": -196.89, "bias": 4.84}, {"date": "2026-07-23", "net_score": 404.62, "bias": 11.01}, {"date": "2026-07-24", "net_score": -36.74, "bias": 2.57}]}]};

function render() {
  const root = document.querySelector('.viz-root');
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const themeAttr = document.documentElement.getAttribute('data-theme');
  const dark = themeAttr ? themeAttr === 'dark' : isDark;

  document.getElementById('subtitle').textContent =
    `資料日期：${DATA.trade_date} ・ 篩選條件：廣度 ≥ 2，NetScore 前後各取最多 10 檔（共 ${DATA.points.length} 檔）`;

  const pts = DATA.points;
  const W = 960, H = 620;
  const M = { top: 30, right: 30, bottom: 50, left: 60 };
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;

  const xs = pts.map(p => p.net_score);
  const ys = pts.map(p => p.bias);
  const allTrailX = pts.flatMap(p => p.trail.map(t => t.net_score).filter(v => v !== null));
  const allTrailY = pts.flatMap(p => p.trail.map(t => t.bias).filter(v => v !== null));
  const xMax = Math.max(...xs.map(Math.abs), ...allTrailX.map(Math.abs), 1) * 1.15;
  const yMax = Math.max(...ys.map(Math.abs), ...allTrailY.map(Math.abs), 1) * 1.15;

  const xScale = v => M.left + (v + xMax) / (2 * xMax) * plotW;
  const yScale = v => M.top + (yMax - v) / (2 * yMax) * plotH;

  const breadths = pts.map(p => p.breadth);
  const bMin = Math.min(...breadths), bMax = Math.max(...breadths);
  const rScale = b => {
    if (bMax === bMin) return 8;
    const t = (b - bMin) / (bMax - bMin);
    return 6 + Math.sqrt(t) * 10;
  };

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', '跨ETF個股籌碼象限圖，橫軸為淨加碼分數，縱軸為股價乖離率');

  function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // quadrant backgrounds
  const redSoft = getComputedStyle(root).getPropertyValue('--red-soft').trim();
  const blueSoft = getComputedStyle(root).getPropertyValue('--blue-soft').trim();
  const red = getComputedStyle(root).getPropertyValue('--red').trim();
  const blue = getComputedStyle(root).getPropertyValue('--blue').trim();
  const redTrail = getComputedStyle(root).getPropertyValue('--red-trail').trim();
  const blueTrail = getComputedStyle(root).getPropertyValue('--blue-trail').trim();

  svg.appendChild(el('rect', { x: xScale(0), y: M.top, width: xScale(xMax) - xScale(0), height: yScale(0) - M.top, fill: redSoft }));
  svg.appendChild(el('rect', { x: M.left, y: M.top, width: xScale(0) - M.left, height: yScale(0) - M.top, fill: blueSoft }));
  svg.appendChild(el('rect', { x: xScale(0), y: yScale(0), width: xScale(xMax) - xScale(0), height: yScale(-yMax) - yScale(0), fill: redSoft }));
  svg.appendChild(el('rect', { x: M.left, y: yScale(0), width: xScale(0) - M.left, height: yScale(-yMax) - yScale(0), fill: blueSoft }));

  // gridlines (light)
  [-1, -0.5, 0.5, 1].forEach(f => {
    svg.appendChild(el('line', { class: 'grid-line', x1: xScale(f * xMax), y1: M.top, x2: xScale(f * xMax), y2: H - M.bottom }));
    svg.appendChild(el('line', { class: 'grid-line', x1: M.left, y1: yScale(f * yMax), x2: W - M.right, y2: yScale(f * yMax) }));
  });

  // zero axes
  svg.appendChild(el('line', { class: 'zero-line', x1: xScale(0), y1: M.top, x2: xScale(0), y2: H - M.bottom }));
  svg.appendChild(el('line', { class: 'zero-line', x1: M.left, y1: yScale(0), x2: W - M.right, y2: yScale(0) }));

  // quadrant labels
  const qlabel = (x, y, text, anchor) => {
    const t = el('text', { class: 'quad-label', x, y, 'text-anchor': anchor });
    t.textContent = text;
    svg.appendChild(t);
  };
  qlabel(xScale(xMax) - 6, M.top + 16, '順勢加碼', 'end');
  qlabel(M.left + 6, M.top + 16, '逆勢加碼', 'start');
  qlabel(xScale(xMax) - 6, H - M.bottom - 8, '強勢減碼', 'end');
  qlabel(M.left + 6, H - M.bottom - 8, '弱勢減碼', 'start');

  // axis labels
  const xlab = el('text', { class: 'axis-label', x: W / 2, y: H - 10, 'text-anchor': 'middle' });
  xlab.textContent = 'NetScore（跨ETF淨加碼分數，AUM加權）→';
  svg.appendChild(xlab);
  const ylab = el('text', { class: 'axis-label', x: -H / 2, y: 16, 'text-anchor': 'middle', transform: 'rotate(-90)' });
  ylab.textContent = 'BIAS 20日乖離率（%）→';
  svg.appendChild(ylab);

  // tick labels
  [-xMax, 0, xMax].forEach(v => {
    const t = el('text', { class: 'tick-label', x: xScale(v), y: H - M.bottom + 16, 'text-anchor': 'middle' });
    t.textContent = v.toFixed(0);
    svg.appendChild(t);
  });
  [-yMax, 0, yMax].forEach(v => {
    const t = el('text', { class: 'tick-label', x: M.left - 8, y: yScale(v) + 4, 'text-anchor': 'end' });
    t.textContent = v.toFixed(1) + '%';
    svg.appendChild(t);
  });

  const tooltip = document.getElementById('tooltip');

  function showTooltip(evt, p) {
    tooltip.innerHTML = '';
    const title = document.createElement('div');
    title.className = 't-title';
    title.textContent = p.stock_name ? `${p.stock_code} ${p.stock_name}` : p.stock_code;
    tooltip.appendChild(title);
    const rows = [
      ['NetScore', p.net_score.toFixed(2)],
      ['BIAS', p.bias.toFixed(2) + '%'],
      ['收盤價', p.close !== null ? p.close.toFixed(2) : '—'],
      ['象限', p.quadrant || '—'],
      ['買超ETF家數', String(p.n_buy)],
      ['賣超ETF家數', String(p.n_sell)],
      ['最長連續加碼天數', String(p.max_buy_streak)],
      ['最長連續減碼天數', String(p.max_sell_streak)],
    ];
    rows.forEach(([k, v]) => {
      const row = document.createElement('div');
      row.className = 't-row';
      const kEl = document.createElement('span');
      kEl.textContent = k;
      const vEl = document.createElement('span');
      vEl.className = 't-val';
      vEl.textContent = v;
      row.appendChild(kEl);
      row.appendChild(vEl);
      tooltip.appendChild(row);
    });
    tooltip.classList.add('show');
    moveTooltip(evt);
  }

  function moveTooltip(evt) {
    const pad = 14;
    let left = evt.clientX + pad;
    let top = evt.clientY + pad;
    if (left + 200 > window.innerWidth) left = evt.clientX - 200 - pad;
    if (top + 180 > window.innerHeight) top = evt.clientY - 180 - pad;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function hideTooltip() {
    tooltip.classList.remove('show');
  }

  // Pass 1: trails, dots, hit targets. Label placement happens in pass 2,
  // once every dot's final (cx, cy) is known, so labels can avoid both
  // other labels AND other dots.
  const placedDots = [];
  pts.forEach(p => {
    const color = p.net_score >= 0 ? red : blue;
    const trailColor = p.net_score >= 0 ? redTrail : blueTrail;

    const trailPts = p.trail.filter(t => t.net_score !== null && t.bias !== null);
    if (trailPts.length > 1) {
      const d = trailPts.map((t, i) => `${i === 0 ? 'M' : 'L'} ${xScale(t.net_score)} ${yScale(t.bias)}`).join(' ');
      const path = el('path', { class: 'trail-path', d, stroke: trailColor, opacity: 0.55 });
      svg.appendChild(path);
      trailPts.forEach((t, i) => {
        if (i === trailPts.length - 1) return;
        svg.appendChild(el('circle', { cx: xScale(t.net_score), cy: yScale(t.bias), r: 2.5, fill: trailColor }));
      });
    }

    const cx = xScale(p.net_score), cy = yScale(p.bias);
    const r = rScale(p.breadth);
    const dot = el('circle', { class: 'dot', cx, cy, r, fill: color });
    svg.appendChild(dot);
    placedDots.push({ p, cx, cy, r });

    const hit = el('circle', { class: 'hit', cx, cy, r: Math.max(r, 12) });
    hit.addEventListener('pointerenter', evt => showTooltip(evt, p));
    hit.addEventListener('pointermove', moveTooltip);
    hit.addEventListener('pointerleave', hideTooltip);
    hit.addEventListener('focus', evt => showTooltip(evt, p));
    hit.addEventListener('blur', hideTooltip);
    hit.setAttribute('tabindex', '0');
    svg.appendChild(hit);
  });

  // Pass 2: direct labels, largest bubble first, skipping any label that
  // would overlap an already-placed label or another dot -- per the
  // "label selectively" rule, the rest stay reachable via hover/table.
  const CHAR_W = 6.3, LABEL_H = 13;
  const placedLabelRects = [];
  const rectsOverlap = (a, b) => !(a.x2 < b.x1 || a.x1 > b.x2 || a.y2 < b.y1 || a.y1 > b.y2);

  [...placedDots].sort((a, b) => b.r - a.r).forEach(({ p, cx, cy, r }) => {
    const text = p.stock_name ? `${p.stock_code} ${p.stock_name}` : p.stock_code;
    const lx = cx + r + 4, ly = cy + 4;
    const rect = { x1: lx - 2, y1: ly - LABEL_H, x2: lx + text.length * CHAR_W + 2, y2: ly + 3 };

    const hitsLabel = placedLabelRects.some(o => rectsOverlap(rect, o));
    const hitsDot = placedDots.some(o => {
      if (o.p === p) return false;
      const dx = Math.max(o.cx - rect.x2, rect.x1 - o.cx, 0);
      const dy = Math.max(o.cy - rect.y2, rect.y1 - o.cy, 0);
      return Math.hypot(dx, dy) < o.r;
    });
    if (hitsLabel || hitsDot) return;

    placedLabelRects.push(rect);
    const label = el('text', { class: 'point-label', x: lx, y: ly });
    label.textContent = text;
    svg.appendChild(label);
  });

  const wrap = document.getElementById('chartWrap');
  wrap.innerHTML = '';
  wrap.appendChild(svg);

  // table view
  const tableWrap = document.getElementById('tableWrap');
  const table = document.createElement('table');
  table.className = 'data-table';
  const thead = document.createElement('thead');
  thead.innerHTML = '';
  const headRow = document.createElement('tr');
  ['代號', '名稱', '象限', 'NetScore', 'BIAS(%)', '收盤價', '買超家數', '賣超家數', '最長連買', '最長連賣'].forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  [...pts].sort((a, b) => b.net_score - a.net_score).forEach(p => {
    const tr = document.createElement('tr');
    const cells = [
      p.stock_code,
      p.stock_name || '—',
      p.quadrant || '—',
      p.net_score.toFixed(2),
      p.bias.toFixed(2),
      p.close !== null ? p.close.toFixed(2) : '—',
      String(p.n_buy),
      String(p.n_sell),
      String(p.max_buy_streak),
      String(p.max_sell_streak),
    ];
    cells.forEach((c, i) => {
      const td = document.createElement('td');
      td.textContent = c;
      if (i === 3) td.className = p.net_score >= 0 ? 'pos' : 'neg';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.innerHTML = '';
  tableWrap.appendChild(table);
}

document.getElementById('tableToggle').addEventListener('click', () => {
  const chart = document.getElementById('chartWrap');
  const table = document.getElementById('tableWrap');
  const showingTable = !table.classList.contains('hidden');
  chart.classList.toggle('hidden', !showingTable);
  table.classList.toggle('hidden', showingTable);
  document.getElementById('tableToggle').textContent = showingTable ? '切換表格檢視' : '切換圖表檢視';
});

render();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>

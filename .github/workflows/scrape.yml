name: Daily ETF Scrape

on:
  schedule:
    # 22:00 Asia/Taipei (UTC+8) = 14:00 UTC, Monday-Friday only
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run scraper on fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          MACHINE_ID=$(flyctl machine list -a top10-active-etf-tracker --json | jq -r '.[0].id')
          echo "Starting machine $MACHINE_ID"
          flyctl machine start "$MACHINE_ID" -a top10-active-etf-tracker

          echo "Waiting for scrape to finish..."
          STATE=""
          # fly.io machines that have sat stopped for hours have shown a
          # slow cold start (DNS/network init) of several minutes before
          # the app even starts running, on top of the scrape itself --
          # so this needs real headroom, not just the scrape's own runtime.
          for i in $(seq 1 60); do
            sleep 10
            STATE=$(flyctl machine list -a top10-active-etf-tracker --json | jq -r --arg id "$MACHINE_ID" '.[] | select(.id==$id) | .state')
            echo "  [$((i*10))s] state: $STATE"
            if [ "$STATE" = "stopped" ]; then
              break
            fi
          done

          if [ "$STATE" != "stopped" ]; then
            echo "::error::Scrape did not finish within the wait window (last state: $STATE)"
            exit 1
          fi
          echo "Scrape finished, checking exit code..."

          STATUS_TEXT=$(flyctl machine status "$MACHINE_ID" -a top10-active-etf-tracker)
          echo "$STATUS_TEXT"
          EXIT_LINE=$(echo "$STATUS_TEXT" | grep -m1 'exit_code=' || true)

          if [ -z "$EXIT_LINE" ]; then
            echo "::error::Could not find an exit_code in machine status output"
            exit 1
          fi
          if ! echo "$EXIT_LINE" | grep -q 'exit_code=0,'; then
            echo "::error::Scraper exited non-zero: $EXIT_LINE (check 'flyctl logs -a top10-active-etf-tracker' for which ETF failed)"
            exit 1
          fi
          echo "Scraper exited 0."

  report:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r analysis/requirements.txt

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Start DB proxy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_API_TOKEN }}
        run: |
          nohup flyctl proxy 15432:5432 -a top10-active-etf-db > proxy.log 2>&1 &
          echo $! > proxy.pid
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/15432) 2>/dev/null; then
              echo "proxy ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Generate report
        env:
          DATABASE_URL_RAW: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL=$(python -c "import os,re; s=os.environ['DATABASE_URL_RAW'].strip().lstrip('﻿'); print(re.sub(r'@[^/]+/', '@localhost:15432/', s))")
          python analysis/generate_report.py

      - name: Stop DB proxy
        if: always()
        run: kill "$(cat proxy.pid)" 2>/dev/null || true

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No change in generated report, skipping commit."
            echo "CHANGED=false" >> "$GITHUB_ENV"
          else
            git commit -m "Update quadrant chart $(date -u +%Y-%m-%d)"
            git push
            echo "CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Notify via ntfy
        if: env.CHANGED == 'true'
        run: curl -s -X POST https://ntfy.sh/ --data-binary @ntfy_payload.json

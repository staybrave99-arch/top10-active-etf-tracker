name: Diag (one-off, delete after use)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          pip install -r analysis/requirements.txt
          pip install -r requirements.txt

      - name: Dump capitalfund raw PCF date fields
        run: PYTHONPATH=. python analysis/_diag_capitalfund_dates.py

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Start DB proxy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_API_TOKEN }}
        run: |
          nohup flyctl proxy 15432:5432 -a top10-active-etf-db > proxy.log 2>&1 &
          echo $! > proxy.pid
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/15432) 2>/dev/null; then
              echo "proxy ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run diagnostic
        env:
          DATABASE_URL_RAW: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL=$(python -c "import os,re; s=os.environ['DATABASE_URL_RAW'].strip().lstrip('﻿'); print(re.sub(r'@[^/]+/', '@localhost:15432/', s))")
          python analysis/_diag_date_lag.py
          python analysis/_diag_scraped_at.py
          python analysis/_diag_mismatches.py

      - name: Stop DB proxy
        if: always()
        run: kill "$(cat proxy.pid)" 2>/dev/null || true
